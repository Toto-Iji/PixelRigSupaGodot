<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelRig</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        
        body {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        
        #gameFrame {
            border: none;
            width: 100%;
            height: 100%;
        }
        
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        #playButton {
            background: #0066cc;
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 24px;
            border-radius: 10px;
            cursor: pointer;
            font-family: Arial, sans-serif;
        }
        
        #playButton:hover {
            background: #0052a3;
        }
        
        h1 {
            color: white;
            margin-bottom: 30px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="startScreen">
        <h1>PixelRig</h1>
        <button id="playButton">TAP TO PLAY</button>
    </div>
    <iframe id="gameFrame" src="game.html" allow="autoplay; fullscreen"></iframe>
    
    <script>
        const startScreen = document.getElementById('startScreen');
        const playButton = document.getElementById('playButton');
        const gameFrame = document.getElementById('gameFrame');
        
        playButton.addEventListener('click', function() {
            // Remove start screen
            startScreen.style.display = 'none';
            
            // Request fullscreen
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.mozRequestFullScreen) {
                elem.mozRequestFullScreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        });
    </script>
</body>
</html>
